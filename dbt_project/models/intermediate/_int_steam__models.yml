# This file documents the intermediate models and tells dbt which data quality checks to run.
# Comments starting with # are for people reading this file; dbt ignores them.
version: 2

models:
  - name: int_steam__games_latest
    description: >
      One row per game: the newest row of each game from stg_steam__games.
      The base of dim_game. Unreleased games are kept (coming_soon tells them apart).
      If a game is missing from the newest run, its row comes from an older run.

    columns:
      - name: steam_appid
        description: Steam id of the game. One row per game, so it is the key.
        data_tests:
          - unique        # Fail if a game appears twice, so the "keep number 1" step went wrong.
          - not_null      # Fail if any row is missing a game id.


  - name: dim_date
    description: >
      One row per day that has a run, taken from staging (not read from Steam).
      The fact table points to it with snapshot_date.

    columns:
      - name: date_day
        description: The calendar day (Stockholm day, same as snapshot_date in the fact).
        data_tests:
          - unique        # Fail if a day appears twice, so the list is wrong.
          - not_null      # Fail if a row has no day.