# This file documents the intermediate models and tells dbt which data quality checks to run.
# Comments starting with # are for people reading this file; dbt ignores them.
version: 2

models:
  - name: int_steam__games_latest
    description: >
      One row per game: the newest row of each game from stg_steam__games.
      The base of dim_game. Unreleased games are kept (coming_soon tells them apart).
      If a game is missing from the newest run, its row comes from an older run.

    columns:
      - name: steam_appid
        description: Steam id of the game. One row per game, so it is the key.
        data_tests:
          - unique        # Fail if a game appears twice, so the "keep number 1" step went wrong.
          - not_null      # Fail if any row is missing a game id.


  - name: dim_date
    description: >
      One row per day that has a run, taken from staging (not read from Steam).
      The fact table points to it with snapshot_date.

    columns:
      - name: date_day
        description: The calendar day (Stockholm day, same as snapshot_date in the fact).
        data_tests:
          - unique        # Fail if a day appears twice, so the list is wrong.
          - not_null      # Fail if a row has no day.



  - name: dim_game
    description: >
      One row per game, with the things that rarely change (name, release,
      Metacritic score, website, short description, developers, genres).
      Built from the newest row of each game. Price and status are not here,
      they live in the fact tables. Developers and genres stay lists

    columns:
      - name: steam_appid
        description: Steam id of the game. One row per game, so it is the key.
        data_tests:
          - unique        # Fail if a game appears twice, so the star would count it twice.
          - not_null      # Fail if a row has no game id.

      - name: release_year
        description: Year of the release date. NULL for unreleased games.
      - name: metacritic_score
        description: Metacritic critic score, 0 to 100. NULL when Steam shows no score, never 0.
      - name: genres_text
        description: Genres as readable text, for example Indie, Simulation, Strategy.


  - name: fact_game_store
    description: >
      One row per game per run: what the Steam store page showed (price and status).
      Reviews and players are in fact_game_reviews and fact_game_players.

    data_tests:
      # The combination of game id and load id must be unique.
      # This allows the same game to appear in different collection runs.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - steam_appid
              - load_id

    columns:
      - name: steam_appid
        description: Steam id of the game.
        data_tests:
          - not_null      # Fail if a row has no game id.
          # Every game in the fact must exist in dim_game, so the star has no orphans.
          - relationships:
              arguments:
                to: ref('dim_game')
                field: steam_appid

      - name: load_id
        description: The dlt load id, so which run the row came from.
        data_tests:
          - not_null      # Fail if a row does not know its run.

      - name: snapshot_date
        description: The Stockholm day of the run. Points to dim_date.date_day.
        data_tests:
          - not_null      # Fail if a row has no day.
          # Every day in the fact must exist in dim_date.
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: price_initial
        description: Price before any discount, in euros. NULL means no price, never 0.
      - name: price_final
        description: Price after the discount, in euros. NULL means no price, never 0.
      - name: is_free
        description: True for a free game. A free game has no price, so this tells it apart from a missing price.
      - name: coming_soon
        description: True while the game is not released yet. Can change over time.


  - name: fact_game_players
    description: >
      One row per game per run: how many players Steam reported at that moment.
      Rows exist only for runs where player counts were collected.

    data_tests:
      # The combination of game id and load id must be unique.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - steam_appid
              - load_id

    columns:
      - name: steam_appid
        description: Steam id of the game.
        data_tests:
          - not_null      # Fail if a row has no game id.
          # Every game in the fact must exist in dim_game, so the star has no orphans.
          - relationships:
              arguments:
                to: ref('dim_game')
                field: steam_appid

      - name: load_id
        description: The dlt load id, so which run the row came from.
        data_tests:
          - not_null      # Fail if a row does not know its run.

      - name: snapshot_date
        description: The Stockholm day the player count was taken. Points to dim_date.date_day.
        data_tests:
          - not_null      # Fail if a row has no day.
          # Every day in the fact must exist in dim_date.
          # Each fact takes its own date, so this also catches a run that crossed midnight.
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: collected_hour_local
        description: Stockholm hour (0 to 23) when the count was taken. Player counts depend on the hour.
      - name: player_count
        description: Players at that moment. NULL means Steam has no data, 0 is a real zero.
      - name: has_player_data
        description: True when Steam sent a count (result 1), false when it had no data (result 42).


  - name: fact_game_reviews
    description: >
      One row per game per run: review counts, all time and the last 30 days.
      Rows exist for every run that has a review_summary row. The last-30-days
      columns are NULL for runs before review_recent existed (before 2026-11-02).

    data_tests:
      # The combination of game id and load id must be unique.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - steam_appid
              - load_id

      # The last 30 days can never hold more reviews than all time.
      # "warn" reports a problem without failing the test command.
      # "where" skips runs with no recent data, and runs before 2026-11-02, when the
      # all-time total counted English reviews only and could be smaller than the recent one.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "recent_positive + recent_negative <= total_positive + total_negative"
          config:
            severity: warn
            where: "recent_positive is not null and counts_all_languages"

    columns:
      - name: steam_appid
        description: Steam id of the game.
        data_tests:
          - not_null      # Fail if a row has no game id.
          # Every game in the fact must exist in dim_game, so the star has no orphans.
          - relationships:
              arguments:
                to: ref('dim_game')
                field: steam_appid

      - name: load_id
        description: The dlt load id, so which run the row came from.
        data_tests:
          - not_null      # Fail if a row does not know its run.

      - name: snapshot_date
        description: The Stockholm day of the run. Points to dim_date.date_day.
        data_tests:
          - not_null      # Fail if a row has no day.
          # Every day in the fact must exist in dim_date.
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: total_positive
        description: Positive reviews of all time. The total is positive + negative, so it is not stored.
      - name: total_negative
        description: Negative reviews of all time.
      - name: counts_all_languages
        description: False before 2026-11-02, when Steam counted English reviews only. Use it in every trend and change calculation.
      - name: recent_positive
        description: Positive reviews in the last 30 days. NULL before review_recent existed, a real 0 stays 0.
      - name: recent_negative
        description: Negative reviews in the last 30 days. NULL before review_recent existed, a real 0 stays 0.