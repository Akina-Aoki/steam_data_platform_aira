# This file documents the intermediate models and tells dbt which data quality checks to run.
# Comments starting with # are for people reading this file; dbt ignores them.
version: 2

models:
  - name: int_steam__games_latest
    description: >
      One row per game: the newest row of each game from stg_steam__games.
      The base of dim_game. Unreleased games are kept (coming_soon tells them apart).
      If a game is missing from the newest run, its row comes from an older run.

    columns:
      - name: steam_appid
        description: Steam id of the game. One row per game, so it is the key.
        data_tests:
          - unique        # Fail if a game appears twice, so the "keep number 1" step went wrong.
          - not_null      # Fail if any row is missing a game id.


  - name: dim_date
    description: >
      One row per day that has a run, taken from staging (not read from Steam).
      The fact table points to it with snapshot_date.

    columns:
      - name: date_day
        description: The calendar day (Stockholm day, same as snapshot_date in the fact).
        data_tests:
          - unique        # Fail if a day appears twice, so the list is wrong.
          - not_null      # Fail if a row has no day.


  - name: dim_game
    description: >
      One row per game, with the things that rarely change (name, release,
      store info, platforms, lists). Built from the newes
      t row of each game.
      Price and status are not here, they live in the fact table.
      The four lists (developers, publishers, genres, categories) stay lists.

    columns:
      - name: steam_appid
        description: Steam id of the game. One row per game, so it is the key.
        data_tests:
          - unique        # Fail if a game appears twice, so the star would count it twice.
          - not_null      # Fail if a row has no game id.

      - name: release_year
        description: Year of the release date. NULL for unreleased games.
      - name: metacritic_score
        description: Metacritic critic score, 0 to 100. NULL when Steam shows no score, never 0.
      - name: genres_text
        description: Genres as readable text, for example Indie, Simulation, Strategy.


  - name: fact_game_snapshot
    description: >
      One row per game per run: store page, reviews and players together.
      Built from games with left joins, so runs before review_recent (2026-11-02)
      and before player_counts (2026-10-27) keep their row with NULL in those columns.
      Counts only, percentages are worked out in the marts.

    data_tests:
      # One game appears once per run. If a source had two rows for the same
      # game and run, the joins would make duplicates and this test fails.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - steam_appid
              - load_id

      # The last 30 days can never hold more reviews than all time.
      # "where" skips runs with no recent data, and runs before 2026-11-02,
      # when the all-time total counted English reviews only.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "recent_positive + recent_negative <= total_positive + total_negative"
          config:
            severity: warn
            where: "recent_positive is not null and counts_all_languages"

    columns:
      - name: steam_appid
        description: Steam id of the game.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: steam_appid

      - name: load_id
        description: The dlt load id, so which run the row came from.
        data_tests:
          - not_null

      - name: snapshot_date
        description: The Stockholm day of the run. Points to dim_date.date_day.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
                
      - name: snapshot_hour_local
        description: The Stockholm hour (0 to 23) of the run. With snapshot_date it gives one point per hour. Repeats once when the clocks go back in autumn, so use collected_at_utc to order rows.

      - name: price_initial
        description: Price before any discount, in euros. NULL means no price, never 0.
      - name: price_final
        description: Price after the discount, in euros. NULL means no price, never 0.
      - name: is_free
        description: True for a free game. A free game has no price, so this tells it apart from a missing price.
      - name: coming_soon
        description: True while the game is not released yet. Can change over time.
      - name: counts_all_languages
        description: False before 2026-11-02, when Steam counted English reviews only.
      - name: player_count
        description: Players at that moment. NULL means Steam has no data, 0 is a real zero.