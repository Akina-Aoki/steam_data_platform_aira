[project]
name = "steam-data-platform"
version = "0.1.0"
description = "Modern Data Stack for STEAM games and reviews analytics"
readme = "README.md"
authors = [
    { name = "Aira Franco", email = "adelosofranco@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
steam-data-platform = "steam_data_platform:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
ingestion = [
    "dlt[snowflake]>=1.31.0",
    "pandas>=2.3,<3.0",
    "requests>=2.34.2",
]
transform = [
    "dbt-core>=1.12.6",
    "dbt-snowflake>=1.12.3",
]
dashboard = [
    "snowflake-connector-python[pandas]>=4.8.0",
    "streamlit>=1.66.0",
]
